<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Collection — NOIRÉ</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/shop.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    Complimentary shipping on orders over ₹5,000.
  </div>

  <!-- Editorial Header -->
  <header class="site-header">
    <div class="container header-container">
      <ul class="nav-links-left">
        <li><a href="shop.html" style="color:var(--color-accent);">Shop All</a></li>
        <li><a href="shop.html?category=Bags">Bags</a></li>
        <li><a href="shop.html?category=Watches">Watches</a></li>
        <li><a href="shop.html?category=Home">Home</a></li>
      </ul>

      <a href="../index.html" class="brand-logo-center">NOIRÉ</a>

      <div class="header-actions-right">
        <a href="#" id="nav-search-trigger">Search 🔍</a>
        <a href="shop.html">Wishlist (<span class="wishlist-count-badge">0</span>)</a>
        <a href="../cart/cart.html">Bag (<span class="bag-count-badge">0</span>)</a>
      </div>
    </div>
  </header>

  <main style="padding:60px 0 100px;">
    <div class="container">
      <div style="margin-bottom:32px;">
        <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--color-accent); font-weight:700;">THE CATALOG</span>
        <h1 style="font-family:var(--font-heading); font-size:3.5rem; text-transform:uppercase;">THE COLLECTION</h1>
      </div>

      <!-- Category Filter Pills -->
      <div class="cat-pills-bar">
        <button class="shop-cat-pill active" data-category="All">All Pieces</button>
        <button class="shop-cat-pill" data-category="Bags">Bags</button>
        <button class="shop-cat-pill" data-category="Watches">Watches</button>
        <button class="shop-cat-pill" data-category="Accessories">Accessories</button>
        <button class="shop-cat-pill" data-category="Apparel">Apparel</button>
        <button class="shop-cat-pill" data-category="Home">Home</button>
        <button class="shop-cat-pill" data-category="Jewelry">Jewelry</button>
      </div>

      <!-- Catalog Filters & Sort Strip -->
      <div class="catalog-strip">
        <div style="font-size:0.88rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em;" id="catalog-count-lbl">
          16 pieces
        </div>

        <div style="display:flex; gap:16px;">
          <select id="shop-price-select" class="filter-select-control">
            <option value="All">All Prices</option>
            <option value="under3000">Under ₹3,000</option>
            <option value="3000to6000">₹3,000 – ₹6,000</option>
            <option value="6000to10000">₹6,000 – ₹10,000</option>
            <option value="over10000">Above ₹10,000</option>
          </select>

          <select id="shop-sort-select" class="filter-select-control">
            <option value="featured">Featured Edit</option>
            <option value="newest">Newest Pieces</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="shop-products-grid">
        <!-- Rendered dynamically by js/shop.js -->
      </div>
    </div>
  </main>

  <footer style="padding:60px 0 40px; background-color:var(--text-primary); color:var(--bg-primary);">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-family:var(--font-heading); font-size:2rem; letter-spacing:0.15em;">NOIRÉ</span>
      <div style="font-size:0.82rem; color:var(--text-muted);">
        &copy; 2026 NOIRÉ Studio. NOIRÉ is a fictional portfolio demonstration project.
      </div>
    </div>
  </footer>

  <!-- Search Overlay Drawer -->
  <div class="overlay-drawer" id="search-overlay-drawer">
    <div class="drawer-content-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 style="font-family:var(--font-heading); font-size:1.6rem;">SEARCH PIECES</h3>
        <button id="search-close-btn" style="font-size:1.4rem; cursor:pointer;">✕</button>
      </div>

      <input type="text" id="overlay-search-input" placeholder="Type to search bags, watches, ceramics..." style="width:100%; padding:14px; border:1px solid var(--border-color); font-size:1rem; margin-bottom:24px;">

      <div id="overlay-search-results">
        <p style="color:var(--color-secondary);">Start typing to search products...</p>
      </div>
    </div>
  </div>

  <!-- Added To Bag Drawer -->
  <div class="overlay-drawer" id="added-to-bag-drawer">
    <div class="drawer-content-box" id="added-bag-body"></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/shop.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
